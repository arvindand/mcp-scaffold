spring:
  application:
    name: petclinic-mcp-example

  datasource:
    url: jdbc:h2:mem:petclinic
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    mcp:
      server:
        name: petclinic-mcp-server
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: 8080

logging:
  level:
    com.example.petclinic: DEBUG
    org.springframework.ai.mcp: DEBUG
